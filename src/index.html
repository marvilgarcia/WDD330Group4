<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script type="module" src="./js/main.js"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="images/banner-sm.jpg 500w, images/banner.jpg"
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>
      <section class="products">
        <ul class="product-grid">
          <li>
            <a href="product_listing/index.html?category=tents">
              <img src="images/category-tents.svg" alt="Tents" />
              <h2>Tents</h2>
            </a>
          </li>
          <li>
            <a href="product_listing/index.html?category=backpacks">
              <img src="images/category-backpacks.svg" alt="Backpacks" />
              <h2>Backpacks</h2>
            </a>
          </li>
          <li>
            <a href="product_listing/index.html?category=sleeping-bags">
              <img src="images/category-sleepingbags.svg" alt="Sleeping bags" />
              <h2>Sleeping Bags</h2>
            </a>
          </li>
          <li>
            <a href="product_listing/index.html?category=hammocks">
              <img src="images/category-hammocks.svg" alt="Hammocks" />
              <h2>Hammocks</h2>
            </a>
          </li>
        </ul>
      </section>
      <section class="newsletter">
        <h2>Newsletter Signup</h2>

        <p>Subscribe to receive updates and special offers.</p>

        <form id="newsletterForm">
          <input
            type="email"
            id="newsletterEmail"
            placeholder="Enter your email"
            required
          />

          <button type="submit">Subscribe</button>
        </form>

        <p id="newsletterMessage"></p>
      </section>
    </main>

    <button id="backToTop" title="Back to Top">↑ Top</button>

    <footer id="main-footer"></footer>
    <script type="module" src="js/newsletter.js" defer></script>
    <script src="js/backToTop.js"></script>
  </body>
</html>
